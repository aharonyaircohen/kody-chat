name: release validation

on:
  push:
  pull_request:

workflow_dispatch: {}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: "pnpm"
    - name: Prime package manager
      run: pnpm install --frozen-lockfile
    - name: Lint
      run: pnpm lint
    - name: Typecheck
      run: pnpm typecheck
    - name: Test
      run: pnpm test:unit
    - name: Build
      run: pnpm build
    - name: Smoke test
      run: |
        PW_LOCAL=1 BASE_URL=http://127.0.0.1:3333 pnpm --filter kody-dashboard test:smoke