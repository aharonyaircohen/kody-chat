name: Deploy Dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: dashboard-production-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: aguy
      VERCEL_ORG_ID: team_I5OEeDKS7oRaELnZp5bdJWpL
      VERCEL_PROJECT_ID: prj_VUAH5HAYNBkZb4AWC9gYhOYRhKTA
      KODY_MCP_TEST_CONVEX_URL: ${{ secrets.CONVEX_URL }}
      KODY_SERVICE_KEY: ${{ secrets.KODY_SERVICE_KEY }}
      E2E_GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
      E2E_GITHUB_REPO: aharonyaircohen/Kody-Engine-Tester
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter kody-dashboard exec playwright install --with-deps chromium

      - name: Stage, verify, and promote Dashboard
        run: pnpm release:mcp:production
